<title>القواعد والخصوصية</title>

<style>

    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#e3f2fd,#ffffff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;

.box{
    background:white;
    padding:30px;

}

    display:block;

    color:#1976d2;
    font-weight:bold;

<body>

<div class="box">

<h2>القواعد والخصوصية</h2>

<ul>
<li>يُستخدم الموقع لإدارة مساهمات الطلاب فقط.</li>
<li>لا يتم مشاركة البيانات مع أي جهة خارجية.</li>
<li>المستخدم مسؤول عن حماية كلمة المرور الخاصة به.</li>
<li>يمكن طلب حذف الحساب أو تعديل البيانات عند الحاجة.</li>
<li>يجب استخدام النظام بشكل مسؤول وشفاف.</li>
</ul>
