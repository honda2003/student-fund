<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تسجيل الدخول</title>

<style>

body{
font-family:Arial;
background:#f2f6fa;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:40px;
border-radius:12px;
width:300px;
text-align:center;
box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

input{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:10px;
background:#007bff;
color:white;
border:none;
border-radius:6px;
}

</style>

</head>

<body>

<div class="box">

<h2>تسجيل الدخول</h2>

<form method="POST">

<input name="username" placeholder="اسم المستخدم" required>

<input type="password" name="password" placeholder="كلمة المرور" required>

<button type="submit">دخول</button>

</form>

<br>

<a href="/register">إنشاء حساب</a>

{% if error %}
<p style="color:red">{{error}}</p>
{% endif %}

</div>

</body>
</html>
